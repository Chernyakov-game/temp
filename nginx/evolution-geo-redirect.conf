# Nginx config for geo-based redirect on VPS (89.23.106.142)
# Install: sudo apt install nginx libnginx-mod-http-geoip2 mmdb-bin
# GeoIP2 database: https://dev.maxmind.com/geoip/geolite2-free-geolocation-data

load_module modules/ngx_http_geoip2_module.so;

http {
    geoip2 /usr/share/GeoIP/GeoLite2-Country.mmdb {
        $geoip2_country_code country iso_code;
    }

    server {
        listen 80;
        listen 443 ssl;
        server_name evolution.new www.evolution.new;

        # SSL — certbot: sudo certbot --nginx -d evolution.new -d www.evolution.new
        ssl_certificate     /etc/letsencrypt/live/evolution.new/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/evolution.new/privkey.pem;

        # Redirect HTTP → HTTPS
        if ($scheme = http) {
            return 301 https://$host$request_uri;
        }

        location / {
            # Russian visitors → Yandex Cloud mirror
            if ($geoip2_country_code = "RU") {
                return 302 https://ru.evolution.new$request_uri;
            }
            # Everyone else → ReadyMag (direct, no proxy)
            return 302 https://evolution.new.readymag.website$request_uri;
        }
    }
}
