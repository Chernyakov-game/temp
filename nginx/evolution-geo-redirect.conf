# Nginx geo-redirect для evolution.new на VPS 89.23.106.142
#
# Установка зависимостей:
#   sudo apt install nginx libnginx-mod-http-geoip2
#   sudo apt install mmdb-bin
#
# База GeoIP2 (бесплатно, нужна регистрация на maxmind.com):
#   wget -O /tmp/GeoLite2-Country.tar.gz \
#     "https://download.maxmind.com/app/geoip_download?edition_id=GeoLite2-Country&license_key=YOUR_KEY&suffix=tar.gz"
#   tar -xzf /tmp/GeoLite2-Country.tar.gz -C /usr/share/GeoIP/ --strip-components=1
#
# SSL-сертификат:
#   sudo certbot --nginx -d evolution.new -d www.evolution.new
#
# Установка конфига:
#   sudo cp evolution-geo-redirect.conf /etc/nginx/sites-available/evolution
#   sudo ln -s /etc/nginx/sites-available/evolution /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

load_module modules/ngx_http_geoip2_module.so;

http {
    geoip2 /usr/share/GeoIP/GeoLite2-Country.mmdb {
        $geoip2_country_code country iso_code;
    }

    # HTTP → HTTPS
    server {
        listen 80;
        server_name evolution.new www.evolution.new;
        return 301 https://evolution.new$request_uri;
    }

    server {
        listen 443 ssl http2;
        server_name evolution.new www.evolution.new;

        ssl_certificate     /etc/letsencrypt/live/evolution.new/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/evolution.new/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_session_cache   shared:SSL:10m;

        # Логи для отладки геоопределения
        access_log /var/log/nginx/evolution-access.log;
        error_log  /var/log/nginx/evolution-error.log;

        location / {
            # Посетители из РФ → зеркало на Yandex Cloud (доступно в РФ)
            if ($geoip2_country_code = "RU") {
                return 302 https://ru.evolution.new$request_uri;
            }

            # Все остальные → оригинальный ReadyMag
            # ВАЖНО: замени на реальный ReadyMag URL из настроек своего проекта
            # (обычно вида: yourproject.readymag.website)
            return 302 https://readymag.website/evolution$request_uri;
        }
    }
}
