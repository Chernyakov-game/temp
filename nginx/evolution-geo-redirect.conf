# Рабочий конфиг Nginx на VPS 89.23.106.142
# Гео-гейт: python3-сервис на 127.0.0.1:18080 определяет страну по IP
# РФ → 302 на ru.evolution.new (Yandex CDN, прямо без VPS)
# Остальные → proxy через VPS на ru.evolution.new с локальным кэшем

# В /etc/nginx/conf.d/evolution-cache.conf:
# proxy_cache_path /var/cache/nginx/evolution levels=1:2 keys_zone=evolution_cache:10m max_size=500m inactive=60m use_temp_path=off;

server {
    listen 80;
    listen [::]:80;
    server_name evolution.new www.evolution.new;

    if ($host = www.evolution.new) {
        return 301 https://evolution.new$request_uri;
    }

    error_page 403 = @ru_redirect;

    location @ru_redirect {
        add_header Cache-Control "no-store, private" always;
        return 302 https://ru.evolution.new$request_uri;
    }

    location = /_geo_gate {
        internal;
        proxy_pass http://127.0.0.1:18080/gate;
        proxy_set_header X-Original-Remote-Addr $remote_addr;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
    }

    location / {
        auth_request /_geo_gate;
        add_header Cache-Control "no-store, private" always;
        return 301 https://evolution.new$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name evolution.new www.evolution.new;

    ssl_certificate /etc/letsencrypt/live/evolution.new/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/evolution.new/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    if ($host = www.evolution.new) {
        return 301 https://evolution.new$request_uri;
    }

    error_page 403 = @ru_redirect;

    location @ru_redirect {
        add_header Cache-Control "no-store, private" always;
        return 302 https://ru.evolution.new$request_uri;
    }

    location = /_geo_gate {
        internal;
        proxy_pass http://127.0.0.1:18080/gate;
        proxy_set_header X-Original-Remote-Addr $remote_addr;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
    }

    location / {
        auth_request /_geo_gate;
        add_header Cache-Control "no-store, private" always;
        proxy_cache evolution_cache;
        proxy_cache_valid 200 10m;
        proxy_cache_use_stale error timeout updating;
        proxy_cache_lock on;
        proxy_ignore_headers Cache-Control;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name ru.evolution.new;
        proxy_set_header Host ru.evolution.new;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_pass https://ru.evolution.new;
    }
}
